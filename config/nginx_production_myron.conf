# =========================================================================
# MYRON Perfume - Production Nginx Hardened Configuration
# Location: /etc/nginx/sites-available/myron.conf
# =========================================================================

# Rate limit zone: 10 requests per second per IP (burst up to 20)
limit_req_zone $binary_remote_addr zone=myron_req_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=myron_conn_limit:10m;

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name myron.uz www.myron.uz;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myron.uz www.myron.uz;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/myron.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myron.uz/privkey.pem;

    # Hardened SSL/TLS Protocol & Cipher Specs
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Hide Nginx Version
    server_tokens off;

    # Maximum Body Size (Image Upload Limit)
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Request Timeouts
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # Global Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self';" always;

    # BLOCK ALL SENSITIVE FILES & DIRECTORIES (.env, .git, db.sqlite3, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ~* \.(sqlite3|log|env|git|sh|bak|config|sql)$ {
        deny all;
        return 404;
    }

    # Static Files
    location /static/ {
        alias /var/www/myron/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media Files (No-Exec for uploaded images)
    location /media/ {
        alias /var/www/myron/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        types { }
        default_type image/png;
    }

    # Proxy to Gunicorn WSGI
    location / {
        limit_req zone=myron_req_limit burst=20 nodelay;
        limit_conn myron_conn_limit 15;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
