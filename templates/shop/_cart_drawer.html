{% load i18n %}
{% if cart_items %}
<div class="cart-items">
  {% for item in cart_items %}
  <div class="cart-item" data-product-id="{{ item.product.id }}" data-variant-code="{{ item.variant_code }}">
    <img src="{{ item.product.image_url }}" alt="{{ item.product.name }}">
    <div class="cart-item-info">
      <h4>{{ item.product.name }}</h4>
      <span class="cart-item-price">{{ item.variant_label }} · ${{ item.variant_price }}</span>
      <div class="qty-control">
        <button class="qty-btn qty-minus" data-id="{{ item.product.id }}"
          data-variant-code="{{ item.variant_code }}">-</button>
        <span>{{ item.quantity }}</span>
        <button class="qty-btn qty-plus" data-id="{{ item.product.id }}"
          data-variant-code="{{ item.variant_code }}">+</button>
      </div>
    </div>
    <button class="cart-item-remove" data-id="{{ item.product.id }}" data-variant-code="{{ item.variant_code }}"
      aria-label="{% trans 'Olib tashlash' %}">&times;</button>
  </div>
  {% endfor %}
</div>
<div class="cart-drawer-footer">
  <div class="cart-total-row">
    <span>{% trans "Jami:" %}</span>
    <strong>${{ cart_total }}</strong>
  </div>
  <button class="btn btn-gold btn-block" id="openCheckout">{% trans "Buyurtma berish" %}</button>
</div>
{% else %}
<div class="cart-empty">
  <svg width="52" height="52" viewBox="0 0 24 24" fill="none">
    <path d="M3 4H5L6.68 14.39A2 2 0 0 0 8.65 16H18.42A2 2 0 0 0 20.39 14.45L22 6H6" stroke="currentColor"
      stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="9" cy="20" r="1.2" fill="currentColor" />
    <circle cx="18" cy="20" r="1.2" fill="currentColor" />
  </svg>
  <p>{% trans "Savatingiz bo'sh" %}</p>
</div>
{% endif %}
